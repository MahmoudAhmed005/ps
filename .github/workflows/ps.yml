name: Cloud  Pipeline

on:
  workflow_dispatch:

jobs:
  compressor_node:
    runs-on: ubuntu-latest
    steps:
      # 1. ONE RESTORE STEP: Clone, merge, decrypt, and extract
      - name: Restore Encrypted Backup
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
          GH_USER: ${{ secrets.GH_USERNAME }}
          REPO_NAME: ${{ secrets.BACKUP_REPO }}
          ENC_PASS: ${{ secrets.ENCRYPTION_PASS }}
        run: |
          cd /home/runner/work
          # Clone the backup repo using your PAT and Username
          git clone https://${GH_USER}:${GH_TOKEN}@github.com/${GH_USER}/${REPO_NAME}.git backup-repo || true
          
          # Check for chunks, combine, decrypt, and extract
          if ls backup-repo/chunks/backup_part_* 1> /dev/null 2>&1; then
            echo "Recombining chunks..."
            cat backup-repo/chunks/backup_part_* > backup.tar.gz.enc
            
            echo "Decrypting and restoring files..."
            openssl enc -aes-256-cbc -d -pbkdf2 -pass pass:"$ENC_PASS" -in backup.tar.gz.enc | tar -xzf -
            echo "Backup restored successfully!"
          else
            echo "No chunks found, creating fresh storage folders."
            mkdir -p storage/raw storage/compressed
          fi

      # 2. RUN TAILSCALE
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          args: --ssh

      # 3. KEEP ALIVE
      - name: Keep Alive (Running)
        run: |
          echo "☁️ The Cloud Compressor is now online."
          echo "Click 'Cancel Run' to trigger the secure backup and shutdown."
          sleep 20700

      # 4. ONE BACKUP STEP: Compress & Encrypt (on the fly), split, and force-push
      - name: Encrypt Backup & Push to Repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
          GH_USER: ${{ secrets.GH_USERNAME }}
          REPO_NAME: ${{ secrets.BACKUP_REPO }}
          ENC_PASS: ${{ secrets.ENCRYPTION_PASS }}
        run: |
          cd /home/runner/work
          echo "Compressing and encrypting storage on the fly..."
          tar -czf - storage/ | openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:"$ENC_PASS" -out backup.tar.gz.enc
          
          echo "Splitting encrypted file into 50MB chunks..."
          mkdir -p backup-repo/chunks
          rm -f backup-repo/chunks/backup_part_*
          split -b 50M backup.tar.gz.enc backup-repo/chunks/backup_part_
          
          echo "Force-pushing encrypted chunks to GitHub..."
          cd backup-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan temp-branch
          git add chunks/
          git commit -m "Automated Encrypted Backup [skip ci]"
          git branch -M main
          git push -f https://${GH_USER}:${GH_TOKEN}@github.com/${GH_USER}/${REPO_NAME}.git main

      # 5. UPLOAD SECURE ARTIFACT (Fallback)
      - name: Upload Encrypted Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-backup-encrypted
          path: /home/runner/work/backup.tar.gz.enc
          retention-days: 5
