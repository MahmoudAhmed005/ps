name: Minecraft Server CI & Remote Access

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 1. Tailscale Setup ---
      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --ssh

      # --- 2. Shell Environment Setup ---
      - name: Configure Interactive Bash Environment
        run: |
          sudo chsh -s /bin/bash runner || true
          sudo chsh -s /bin/bash root || true

          cat << 'EOF' | sudo tee /etc/profile.d/interactive_term.sh
          export TERM=xterm-256color
          export SHELL=/bin/bash
          EOF

          echo 'export TERM=xterm-256color' | sudo tee -a /home/runner/.bashrc /root/.bashrc

      # --- 3. Keep Runner Alive for SSH Sessions ---
      - name: Keep Runner Alive
        run: |
          echo "Tailscale SSH is active. Connect via: tailscale ssh runner@<node-name>"
          # Keeps runner up for up to 6 hours (or until you kill this process / cancel the job)
          sleep 6h

      # --- 4. Backup Steps (Only execute when session finishes, times out, or cancels) ---
      - name: Create Backup Archive
        if: always()
        run: |
          mkdir -p /home/runner/backups
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          ARCHIVE_FILE="/home/runner/backups/server_backup_${TIMESTAMP}.tar.gz"

          TARGETS=(
            "/home/runner/minecraft/data/world"
            "/home/runner/minecraft/data/mods"
            "/home/runner/work"
          )

          EXISTING_TARGETS=()
          for item in "${TARGETS[@]}"; do
            if [ -e "$item" ]; then
              EXISTING_TARGETS+=("$item")
            fi
          done

          if [ ${#EXISTING_TARGETS[@]} -gt 0 ]; then
            echo "Archiving: ${EXISTING_TARGETS[*]}"
            tar -czf "$ARCHIVE_FILE" "${EXISTING_TARGETS[@]}"
          else
            echo "No targets found to back up."
          fi

      - name: Upload Backup Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-backup
          path: /home/runner/backups/*.tar.gz
          if-no-files-found: warn
