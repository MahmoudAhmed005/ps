name: Minecraft Server CI & Remote Access

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Setup Tailscale SSH with Full Terminal Support ---
      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --ssh

      - name: Configure Interactive Bash Environment
        run: |
          # Set default shell to bash for runner and root
          sudo chsh -s /bin/bash runner || true
          sudo chsh -s /bin/bash root || true

          # Configure terminal variables for interactive sessions
          cat << 'EOF' | sudo tee -a /etc/profile.d/interactive_term.sh
          export TERM=xterm-256color
          export SHELL=/bin/bash
          EOF

      # --- Backup Target Directories ---
      - name: Create Backup Archive
        if: always()
        run: |
          mkdir -p /home/runner/backups
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          ARCHIVE_FILE="/home/runner/backups/server_backup_${TIMESTAMP}.tar.gz"

          TARGETS=(
            "/home/runner/minecraft/data/world"
            "/home/runner/minecraft/data/mods"
            "/home/runner/work"
          )

          EXISTING_TARGETS=()
          for item in "${TARGETS[@]}"; do
            if [ -e "$item" ]; then
              EXISTING_TARGETS+=("$item")
            fi
          done

          if [ ${#EXISTING_TARGETS[@]} -gt 0 ]; then
            echo "Backing up: ${EXISTING_TARGETS[*]}"
            tar -czf "$ARCHIVE_FILE" "${EXISTING_TARGETS[@]}"
            echo "BACKUP_PATH=$ARCHIVE_FILE" >> $GITHUB_ENV
          else
            echo "No specified directories found to back up."
          fi

      - name: Upload Backup Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-backup
          path: /home/runner/backups/*.tar.gz
          if-no-files-found: warn

      # --- Keep Workflow Alive for Tailscale Access ---
      - name: Keep Runner Alive
        run: |
          echo "Tailscale SSH is ready. Connect via: tailscale ssh runner@<node-name>"
          sleep 6h
