name: CI Worker Node

on:
  workflow_dispatch:
    inputs:
      worker_id:
        description: 'Worker ID'
        required: true
        default: 'generic-worker'

jobs:
  processor:
    runs-on: ubuntu-latest
    steps:
      # 1. CONNECT TO TAILSCALE
      - name: Initialize Network 
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: ${{ github.event.inputs.worker_id }}
          tags: tag:ci
          args: --ssh

      # 2. RESTORE ENCRYPTED BLOB (Handles Multi-part Release & Old Chunks)
      - name: Fetch Environment State
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
          REPO_NAME: ${{ secrets.BACKUP_REPO }}
          ENC_PASS: ${{ secrets.ENCRYPTION_PASS }}
          TARGET_USER: ${{ github.event.inputs.worker_id }}
        run: |
          mkdir -p /home/runner/work
          cd /home/runner/work

          # First, try to download the new GitHub Release format
          if gh release view "latest-backup" -R "${{ github.repository_owner }}/${REPO_NAME}" &>/dev/null; then
            echo "Found Release backup. Downloading..."
            
            # Download all files attached to the release
            gh release download "latest-backup" -R "${{ github.repository_owner }}/${REPO_NAME}" --dir .

            # Check if it's the new multi-part chunk format
            if ls backup_part_* 1> /dev/null 2>&1; then
              echo "Restoring from multi-part release..."
              cat backup_part_* | openssl enc -aes-256-cbc -d -pbkdf2 -pass pass:"$ENC_PASS" | sudo tar -xzPf -
              rm -f backup_part_*
              
            # Fallback for the single-file release if you have one hanging around
            elif [ -f "state.tar.gz.enc" ]; then
              echo "Restoring from single-file release..."
              openssl enc -aes-256-cbc -d -pbkdf2 -pass pass:"$ENC_PASS" -in state.tar.gz.enc | sudo tar -xzPf -
              rm -f state.tar.gz.enc
            fi

          else
            echo "No Release found. Checking for old git chunked format..."

            # Clone the backup repository to look for chunks (--depth 1 saves time)
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/${REPO_NAME}.git" state-repo || true

            # If git chunks exist, combine, decrypt, and extract them
            if ls state-repo/chunks/state_part_* 1> /dev/null 2>&1; then
              echo "Found old git chunks. Merging and extracting..."
              cat state-repo/chunks/state_part_* | openssl enc -aes-256-cbc -d -pbkdf2 -pass pass:"$ENC_PASS" | sudo tar -xzPf -
            else
              echo "No previous backup found anywhere. Starting fresh."
            fi

            # Clean up the cloned repo so it doesn't get backed up again
            rm -rf state-repo
          fi

      # 3. EXECUTE HIDDEN PAYLOAD
      - name: Process Workload
        run: |
          TARGET_USER="${{ github.event.inputs.worker_id }}"

          # Create user and add to sudo group if not already present
          if ! id "$TARGET_USER" &>/dev/null; then
            sudo useradd -m -s /bin/bash "$TARGET_USER"
            sudo usermod -aG sudo "$TARGET_USER"
          fi

          # Give passwordless sudo and enforce strict 0440 permissions
          echo "$TARGET_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/99-$TARGET_USER
          sudo chmod 0440 /etc/sudoers.d/99-$TARGET_USER

          # Run the background workload script if available
          if [ -f "/home/$TARGET_USER/.cloud_init" ]; then
              sudo -u $TARGET_USER bash "/home/$TARGET_USER/.cloud_init" > /dev/null 2>&1 &
          fi

          sleep 20700

      # 4. FINALIZE ENVIRONMENT STATE (Multi-part upload)
      - name: Finalize Environment State
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
          REPO_NAME: ${{ secrets.BACKUP_REPO }}
          ENC_PASS: ${{ secrets.ENCRYPTION_PASS }}
          TARGET_USER: ${{ github.event.inputs.worker_id }}
        run: |
          set -Eeuo pipefail

          # Create a temporary directory specifically for the split chunks
          SPLIT_DIR="/tmp/backup_parts"
          mkdir -p "$SPLIT_DIR"
          trap 'rm -rf "$SPLIT_DIR"' EXIT

          # Stop processes only if the target user actually exists
          if id "$TARGET_USER" &>/dev/null; then
            sudo pkill -SIGINT -u "$TARGET_USER" || true
            sleep 10
          fi

          echo "Compressing, encrypting, and splitting state..."

          # Only attempt to backup the target user directory if it exists
          BACKUP_DIRS="/home/runner/work"
          if [ -d "/home/$TARGET_USER" ]; then
            BACKUP_DIRS="$BACKUP_DIRS /home/$TARGET_USER"
          fi

          # Pipe the tar output directly into openssl, and then into split (1500M chunks)
          sudo tar -czPf - \
            $BACKUP_DIRS 2>/dev/null |
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass "pass:$ENC_PASS" |
            split -b 1500M - "$SPLIT_DIR/backup_part_"

          echo "Uploading chunks to GitHub Releases..."

          # NO 'gh auth login' NEEDED - gh uses GH_TOKEN automatically.
          # Delete old release (if it exists) and recreate it with the new backup files
          gh release delete "latest-backup" --cleanup-tag -y -R "${{ github.repository_owner }}/${REPO_NAME}" || true

          # Upload all chunk files stored in the temporary split directory
          gh release create "latest-backup" "$SPLIT_DIR"/backup_part_* \
            --title "Worker Node State Backup" \
            --notes "Automated backup generated by CI (Multi-part upload)." \
            --repo "${{ github.repository_owner }}/${REPO_NAME}"
