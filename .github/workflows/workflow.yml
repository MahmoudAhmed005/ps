name: Distributed Worker

on:
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      # ==========================================
      # 1. RESTORE STATE
      # ==========================================
      - name: Restore and Reassemble State
        env:
          ENCRYPTION_PASS: ${{ secrets.ENCRYPTION_PASS }}
        run: |
          if ls backup_chunks/state_part_* 1> /dev/null 2>&1; then
            echo "Found encrypted state chunks. Reassembling..."
            cat backup_chunks/state_part_* > restored_state.gpg
            
            # Decrypt and extract directly to root directory to maintain exact paths
            gpg --decrypt --batch --yes --passphrase "$ENCRYPTION_PASS" restored_state.gpg | \
            sudo tar -xzf - -C /
            
            echo "State successfully restored!"
          else
            echo "No backup chunks found. Starting fresh."
            # Ensure the directory exists if starting completely fresh
            sudo mkdir -p /home/runner-1
          fi
          
          # Set correct ownership so the runner can use it
          sudo chown -R $USER:$USER /home/runner-1

      # ==========================================
      # 2. ENVIRONMENT SETUP
      # ==========================================
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 kitty-terminfo
          # Download and install Tailscale from their official repository
          curl -fsSL https://tailscale.com/install.sh | sh
          # Install Python packages (override required for Ubuntu 24.04)
          pip3 install flask flask-cors yt-dlp --break-system-packages

      # ==========================================
      # 3. RUNNER EXECUTION
      # ==========================================
      - name: Start Services
        run: |
          echo "Starting the worker..."
          # Start VPN/Mesh
          sudo tailscale up --authkey=${{ secrets.TS_AUTHKEY }} --ssh --accept-dns=dns
          
          # Start the API
          python3 /home/runner-1/api.py &
          
          # Keep runner alive:
          sleep 19800 

      # ==========================================
      # 4. TIER 1 BACKUP (GIT SPLIT)
      # ==========================================
      - name: Tier 1 Backup - Full Directory Archive
        id: git_backup
        if: always()
        env:
          ENCRYPTION_PASS: ${{ secrets.ENCRYPTION_PASS }}
        run: |
          echo "Archiving FULL /home/runner-1/ directory..."
          
          # Archive the entire directory with NO exclusions
          sudo tar -czf - /home/runner-1/ | \
          gpg --symmetric --cipher-algo AES256 --batch --yes --passphrase "$ENCRYPTION_PASS" -o encrypted_state.gpg

          # Clear old chunks and split into 90MB pieces
          rm -rf backup_chunks
          mkdir -p backup_chunks
          split -b 90M encrypted_state.gpg backup_chunks/state_part_

          # Stage, commit, and push chunks
          git add backup_chunks/
          git commit -m "Automated Full State Backup [skip ci]" || echo "No changes to commit"
          git push origin main

      # ==========================================
      # 5. TIER 2 BACKUP (ARTIFACT FALLBACK)
      # ==========================================
      - name: Tier 2 Backup - Artifact Fallback
        if: always() && steps.git_backup.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: secure-state-backup
          path: encrypted_state.gpg
          retention-days: 3
